<!DOCTYPE html>
<html>

<head>
    <title>Urine Test Strip</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            text-align: center;
        }

        h2 {
            color: darkblue;
        }

        img {
            border: 3px solid blue;
            border-radius: 10px;
        }

        h3 {
            color: green;
        }

        p {
            color: black;
        }
    </style>

</head>

<body>

<center>

<h2>🧪 Interactive Urine Test Strip</h2>

<p>Click on a test strip pad to know its function.</p>

<img src="urine-test-strip.jpg" usemap="#strip">

<map name="strip">

    <area shape="rect" coords="20,20,100,50" href="#glucose">

    <area shape="rect" coords="20,60,100,90" href="#protein">

    <area shape="rect" coords="20,100,100,130" href="#blood">

    <area shape="rect" coords="20,140,100,170" href="#ketone">

    <area shape="rect" coords="20,180,100,210" href="#ph">

</map>

<h3 id="glucose">Glucose Pad</h3>
<p>This pad checks glucose.</p>

<h3 id="protein">Protein Pad</h3>
<p>This pad checks protein.</p>

<h3 id="blood">Blood Pad</h3>
<p>This pad checks blood.</p>

<h3 id="ketone">Ketone Pad</h3>
<p>This pad checks ketones.</p>

<h3 id="ph">pH Pad</h3>
<p>This pad checks pH.</p>

</center>

</body>
</html>
